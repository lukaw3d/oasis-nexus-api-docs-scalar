<!doctype html>
<html>
<head><meta charset="utf-8" /></head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.40.0/dist/browser/standalone.min.js" integrity="sha256-wVef2uf/CTKeqzuSaRpI6QnBGRUSx3vNMqASgAdEQ/Y=" crossorigin="anonymous"></script>

<script>
(async () => {
  const spec = (await (await fetch('https://nexus.oasis.io/v1/spec/v1.yaml')).text())
    .replace(/\/consensus\/.*:\n\s+get:\n(\s+)/gm, '$&tags: ["consensus"]\n$1')
    .replace(/\/\{runtime\}\/.*:\n\s+get:\n(\s+)/gm, '$&tags: ["runtime"]\n$1')
    .replace(/\/\{layer\}\/.*:\n\s+get:\n(\s+)/gm, '$&tags: ["consensus", "runtime"]\n$1')
    .replace(/ \/:\n\s+get:\n(\s+)/gm, '$&tags: ["consensus", "runtime"]\n$1')
    .replace(/ \/recent_blocks:\n\s+get:\n(\s+)/gm, '$&tags: ["consensus", "runtime"]\n$1')
    .replace(/ \/stats\/tx_volume:\n\s+get:\n(\s+)/gm, '$&tags: ["consensus", "runtime"]\n$1')

  Scalar.createApiReference('#app', {
    content: spec,
    proxyUrl: undefined,
    withDefaultFonts: false,
    telemetry: false,
    hideModels: true,
    defaultHttpClient: {
      targetKey: 'js',
      clientKey: 'fetch',
    },

    // Don't want to show these clients first on the list, but can not merely move them lower. Have to disable them.
    hiddenClients: {
      ruby: ['native'],
      php: ['curl', 'guzzle'],
    },
  })
})()
</script>

</body>
</html>
