<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    .section-container {
      contain: paint layout;
      content-visibility: auto;
      contain-intrinsic-size: 100px 600px;
    }
    .sidebar-indent-nested {
      contain: paint layout;
      content-visibility: auto;
      contain-intrinsic-size: 100px 32px;
    }
    .hljs > span {
      contain: paint layout;
      content-visibility: auto;
      contain-intrinsic-size: 16px 16px;
    }
    .scalar-code-block {
      contain: paint layout;
      content-visibility: auto;
      contain-intrinsic-size: 100px 600px;
    }

    .request-section-content-headers, .request-section-content-cookies {
      display: none;
    }
  </style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.40.0/dist/browser/standalone.min.js" integrity="sha256-wVef2uf/CTKeqzuSaRpI6QnBGRUSx3vNMqASgAdEQ/Y=" crossorigin="anonymous"></script>

<script>
(async () => {
  const spec = await (await fetch('https://nexus.oasis.io/v1/spec/v1.yaml')).text()
  Scalar.createApiReference('#app', {
    content: spec,
    proxyUrl: undefined,
    withDefaultFonts: false,
    telemetry: false,
    hideModels: true,
    defaultHttpClient: {
      targetKey: 'js',
      clientKey: 'fetch',
    },

    // Don't want to show these clients first on the list, but can not merely move them lower. Have to disable them.
    hiddenClients: {
      ruby: ['native'],
      php: ['curl', 'guzzle'],
    },
  })
})()
</script>

</body>
</html>
